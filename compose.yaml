services:
  diagnose:
    build: .
    command: ["diagnose"]
  version:
    build: .
    command: ["--version"]
  catalog:
    build: .
    network_mode: none
    volumes:
      - ./tests/fixtures:/fixtures:ro
    command: ["catalog", "--input", "/fixtures/synthetic_tcgdex_valid.json", "--manifest", "/fixtures/synthetic_manifest.json"]
  persistence:
    build: .
    network_mode: none
    volumes:
      - ./tests/fixtures:/fixtures:ro
      - observation_data:/data
    command: ["db", "verify", "--db", "/data/history.sqlite3"]
  discovery:
    build: .
    network_mode: none
    volumes:
      - ./tests/fixtures:/fixtures:ro
      - observation_data:/data
    command: ["discover", "--db", "/data/discovery.sqlite3", "--request", "/fixtures/synthetic_discovery_request.json"]

volumes:
  observation_data:
    external: true
    name: ${CMT_PERSISTENCE_VOLUME:-cmt-p3a-local}
