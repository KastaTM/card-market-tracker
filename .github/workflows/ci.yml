name: Foundation, Catalog and Observation Persistence

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.10"
          python-version: "3.13"
      - run: uv sync --frozen --no-install-project
      - run: uv sync --frozen --no-build-isolation
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen ruff check .
      - run: uv run --frozen mypy src
      - run: uv run --frozen coverage run -m pytest
      - run: uv run --frozen coverage json -o coverage.json
      - run: uv run --frozen python scripts/check_coverage.py coverage.json
      - run: uv build --no-build-isolation
      - run: sh scripts/wheel_smoke.sh
      - run: uv export --frozen --all-groups --no-emit-project -o requirements-audit.txt > /dev/null
      - run: uv run --frozen pip-audit -r requirements-audit.txt
      - run: uv run --frozen python scripts/check_secret_scan.py

  container:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - run: sh scripts/container_smoke.sh cmt-p0-smoke:${{ matrix.platform == 'linux/arm64' && 'arm64' || 'amd64' }} ${{ matrix.platform }}

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: docker compose run --build --rm version
      - run: docker compose run --build --rm diagnose
      - run: docker compose build catalog persistence
      - run: python3 scripts/catalog_smoke.py --mode compose --fixtures tests/fixtures
      - run: python3 scripts/observation_persistence_smoke.py --mode compose --fixtures tests/fixtures
