[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "card-market-tracker"
version = "0.1.0"
description = "Local foundation for Card Market Tracker"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = []

[project.scripts]
cmt = "card_market_tracker.cli:main"

[dependency-groups]
dev = [
  "build>=1.3,<2",
  "coverage>=7.10,<8",
  "detect-secrets>=1.5,<2",
  "hatchling>=1.27,<2",
  "mypy>=1.17,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "ruff>=0.13,<0.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/card_market_tracker"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/pyproject.toml", "/README.md"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["card_market_tracker"]

[tool.coverage.report]
show_missing = true
